<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b19">
  <title>100 Mano Amiga Dicen — Pantalla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app display-app" id="gameStage">
    <header class="header">
      <div>
        <p class="eyebrow">ACTO · 17 DE AGOSTO</p>
        <h1>100 <span>MANO AMIGA</span> DICEN</h1>
      </div>
      <div class="live-badge"><i></i> EN VIVO</div>
    </header>

    <section class="question-card">
      <span class="question-label">PREGUNTA</span>
      <h2 id="questionTitle">Esperando al equipo de control...</h2>
    </section>

    <section class="scoreboard">
      <article class="team team-a active" id="teamA">
        <span class="team-label" id="teamAName">Equipo A</span>
        <strong id="teamAScore">0</strong>
      </article>
      <article class="pot-card">
        <span>POZO</span>
        <strong id="pot">0</strong>
        <div class="strikes" id="strikes"></div>
      </article>
      <article class="team team-b" id="teamB">
        <span class="team-label" id="teamBName">Equipo B</span>
        <strong id="teamBScore">0</strong>
      </article>
    </section>

    <section class="board" id="board"></section>
    <div class="firebase-status" id="firebaseStatus"></div>
  </main>
  <script type="module" src="app-pantalla.js"></script>
</body>
</html>
